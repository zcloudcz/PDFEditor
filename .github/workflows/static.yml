# Builds the standalone PDF editor and deploys it to GitHub Pages (pdf2.zcloud.cz).
name: Deploy editor to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel a running production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUSKY: 0
  # The editor build copies license/NOTICE files from this exact engine source revision.
  PDFIUM_VIEWER_REV: 051abe5b72a9219e6b86e1f890fa7d4aca0e8f49

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Fetch engine source (license files only needed)
        run: |
          git init -q bentopdf-pdfium-viewer
          cd bentopdf-pdfium-viewer
          git remote add origin https://github.com/alam00000/bentopdf-pdfium-viewer.git
          git fetch -q --depth 1 origin "$PDFIUM_VIEWER_REV"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 packages/pdfium/pdfium-src
      - run: npm run build:editor
      - name: Serve editor at site root
        run: |
          cp dist-editor/editor.html dist-editor/index.html
          echo "pdf2.zcloud.cz" > dist-editor/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-editor
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
